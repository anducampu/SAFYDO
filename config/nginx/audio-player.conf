# Safydo — nginx site (deployed to /etc/nginx/sites-available/)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name safydo.local safydo player.local player _;

    root /opt/rpi-audio-player/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # Optional web login (Settings -> System). scripts/web_auth.sh writes
    # safydo-auth.conf when it is on and removes it when off; a glob, so a
    # missing file is not an error.
    include /etc/nginx/safydo-auth*.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        # Logo uploads (3 MB cap in the backend); nginx's default is 1 MB.
        client_max_body_size 4m;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/api/health;
    }

    location = /setup {
        alias /opt/rpi-audio-player/config/captive/portal.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}