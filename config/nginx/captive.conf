# Linked into sites-enabled by backend/services/network.py captive_start() while
# a hotspot started from the UI is up (captive_stop() unlinks it); a hotspot
# raised by captive_watch.sh is served by the main site's /setup instead. It
# answers on the AP address, so it must carry the same optional web login as the
# main site, or it would be a way around it.
server {
    listen 192.168.4.1:80 default_server;
    root /opt/rpi-audio-player/config/captive;
    index portal.html;

    include /etc/nginx/safydo-auth*.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /portal.html;
    }
}