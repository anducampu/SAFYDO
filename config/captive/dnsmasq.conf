interface=wlan0
bind-interfaces
# Without this dnsmasq also binds 127.0.0.1, which collides with any resolver
# already on :53 — the Debian dnsmasq package enables one by default. That
# collision made the portal look like it worked: hostapd was up and the SSID
# visible, but every client associated, got no lease and dropped seconds later.
except-interface=lo
dhcp-range=192.168.4.10,192.168.4.50,255.255.255.0,12h
dhcp-option=3,192.168.4.1
dhcp-option=6,192.168.4.1
server=8.8.8.8
log-queries
log-dhcp
address=/#/192.168.4.1