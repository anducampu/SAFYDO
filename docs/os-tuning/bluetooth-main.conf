# RPI Audio Player (Phase 1)
[General]
# Pi acts as A2DP source → BT speaker/headphone
Name = player
Class = 0x200414
FastConnectable=true
# Remote Stream End-Points on D-Bus: bt_codec_select.sh switches codecs and SBC
# modes through them. build_bluealsa.sh used to add this line, and every
# install.sh run copied this file over it again.
Experimental = true

[Policy]
# AutoEnable belongs here, not in [General]. BlueZ 5.82 (trixie) logs
# "Unknown key AutoEnable for group General" and ignores the stray copy;
# 5.66 (bookworm) reads only the [Policy] one too. Keeping the duplicate
# just made every boot log an error that looked like the real fault when
# the adapter would not power on (it was rfkill — see apply_bluetooth).
AutoEnable=true
ReconnectAttempts=7
ReconnectIntervals=1,2,4,8,16,32,64