[server]
# NO host-name= here, deliberately. Setting it overrides the system hostname,
# so every box published "safydo.local" no matter what /etc/hostname said —
# which silently defeated SAFYDO_HOSTNAME and made two boards on one LAN
# collide exactly as if the option did not exist. Left unset, avahi follows
# the system hostname, so `hostnamectl set-hostname` is the single source of
# truth and scripts/hostname_conflict.sh can actually take effect.
domain-name=local
use-ipv4=yes
use-ipv6=no
# No allow-interfaces: avahi doesn't glob, and interface names vary by dongle
# (wlan0, wlx<mac>, enx<mac>, usb0 gadget link). Publish on everything but lo
# so safydo.local resolves over whichever link is up.
deny-interfaces=lo

[publish]
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=no

[reflector]
enable-reflector=no

[rlimits]
rlimit-core=0
rlimit-data=4194304
rlimit-fsize=0
rlimit-nofile=30
rlimit-stack=4194304
rlimit-nproc=3